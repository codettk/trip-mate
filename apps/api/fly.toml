# TripMate API — Fly.io
#
#   fly deploy -c apps/api/fly.toml
#
# 시크릿은 이 파일에 두지 않는다. `fly secrets set` 으로 넣는다:
#   DATABASE_URL SESSION_SECRET KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET
#   KAKAO_REDIRECT_URI GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN
#
# ⚠ auto_stop_machines 를 켜지 않는다.
#   웹의 nginx 가 <앱>.internal 로 곧장 부르는데, 그 경로는 Fly 프록시를 거치지 않아
#   잠든 머신을 깨우지 못한다. 항상 한 대는 떠 있어야 한다.

app = "tripmate-api"
primary_region = "nrt"          # 도쿄 — 한국에서 가장 가깝다

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  API_PORT = "4000"
  STORAGE_DRIVER = "gdrive"
  AUTH_MODE = "kakao"
  MAX_UPLOAD_MB = "200"
  # 모든 모임 폴더가 이 폴더 아래에 생긴다 (사용자가 Drive 에서 직접 만든 폴더)
  GOOGLE_DRIVE_ROOT_FOLDER_ID = "14s1BIkYu6FkwEz3oU-4JTVApdFMCfbVa"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # 200MB 업로드를 버퍼링하므로 256mb 로 줄이지 않는다

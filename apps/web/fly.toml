# TripMate 웹 — Fly.io
#
#   fly deploy -c apps/web/fly.toml
#
# 이 앱이 사용자가 여는 주소다. nginx 가 정적 번들을 주고 /api 는 API 앱으로 넘긴다.
# VITE_API_BASE 를 비워 둔 채로 빌드하므로 브라우저는 같은 오리진(/api)으로만 부른다 —
# 세션 쿠키가 그대로 붙고, Drive 링크도 이 주소를 통해서만 나간다.

app = "tripmate-web"
primary_region = "nrt"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  # Fly 사설망. API 앱 이름이 바뀌면 여기도 바꾼다.
  API_UPSTREAM = "tripmate-api.internal:4000"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# TripMate 로컬 환경
#
#   docker compose up -d db                      DB만 (기본 개발 방식 — api/web은 호스트에서 npm run dev)
#   docker compose --profile full up -d --build  전체 스택 (사용자 최종 테스트용)
#
# db 는 프로파일이 없어서 항상 뜬다. api/web 은 `full` 프로파일에서만 뜬다.

services:
  db:
    image: postgres:17-alpine
    container_name: tripmate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripmate}
      POSTGRES_DB: ${POSTGRES_DB:-tripmate}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tripmate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripmate} -d ${POSTGRES_DB:-tripmate}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 통합 테스트 전용 DB. 개발 DB를 건드리지 않는다.
  db-test:
    image: postgres:17-alpine
    container_name: tripmate-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: tripmate
      POSTGRES_DB: tripmate_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate -d tripmate_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tripmate-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # .env 의 NODE_ENV 를 따른다. 기본은 production 이다.
      # 목 로그인(AUTH_MODE=mock)으로 전체 스택을 테스트하려면 .env 에 NODE_ENV=development 를 둔다 —
      # env.ts 가 운영 모드에서 목 로그인을 거부하기 때문이고, 그 가드는 그대로 둔다.
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripmate}:${POSTGRES_PASSWORD:-tripmate}@db:5432/${POSTGRES_DB:-tripmate}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 를 .env 에 설정하세요}
      AUTH_MODE: ${AUTH_MODE:-kakao}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:4000/api/auth/kakao/callback}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/.data/storage
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - tripmate-storage:/app/.data/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: tripmate-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PUBLIC_PORT:-8080}:80"

volumes:
  tripmate-pgdata:
  tripmate-storage:

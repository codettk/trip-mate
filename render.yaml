# Render 배포 정의. 대시보드에서 "New → Blueprint" 로 이 저장소를 고르면 그대로 읽는다.
#
# 시크릿은 여기 두지 않는다 (sync: false = 대시보드에서 직접 넣는다).
# 저장소가 공개로 바뀌어도 키가 새지 않아야 하기 때문이다.
#
# ⚠ 무료 플랜은 15분간 요청이 없으면 잠든다. 그 다음 첫 요청이 30~50초 걸린다.
#   Postgres 는 Render 무료가 30일 뒤 삭제되므로 쓰지 않는다 — Neon 을 DATABASE_URL 로 넣는다.

services:
  - type: web
    name: tripmate-codettk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # 한국에서 가장 가까운 무료 리전
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: AUTH_MODE
        value: kakao
      - key: STORAGE_DRIVER
        value: gdrive
      - key: MAX_UPLOAD_MB
        value: "200"
      # 모든 모임 폴더가 이 폴더 아래에 생긴다 (사용자가 Drive 에서 직접 만든 폴더)
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        value: 14s1BIkYu6FkwEz3oU-4JTVApdFMCfbVa

      # ── 아래는 대시보드에서 직접 넣는다 ──────────────────────────
      # 배포 주소가 정해진 뒤에 채운다. 카카오 콘솔의 Redirect URI 와 반드시 같아야 한다.
      - key: APP_ORIGIN
        sync: false
      - key: KAKAO_REDIRECT_URI
        sync: false
      # Neon 연결 문자열 (?sslmode=require 포함)
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
